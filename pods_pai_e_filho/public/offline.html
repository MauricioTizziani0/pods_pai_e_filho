<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080808" />
    <title>Pods sem conexão</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #080808;
        background-image: radial-gradient(40rem 20rem at 20% 0%, rgba(224, 1, 4, 0.16), transparent 60%);
        color: #ededed;
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
        padding: 24px;
      }
      main {
        max-width: 26rem;
        padding: 28px;
        border: 1px solid #262626;
        border-radius: 12px;
        background: #121212;
        box-shadow: 0 0 0 1px rgba(224, 1, 4, 0.16), 0 0 40px -12px rgba(224, 1, 4, 0.5);
        position: relative;
        overflow: hidden;
      }
      main::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        height: 2px;
        width: 100%;
        background: linear-gradient(90deg, #6e0103, #e00104 45%, rgba(224, 1, 4, 0.15));
      }
      .logo {
        display: inline-flex;
        padding: 8px 12px;
        background: #fff;
        border-radius: 8px;
        margin-bottom: 18px;
      }
      .logo img {
        height: 56px;
        width: auto;
        display: block;
      }
      h1 {
        font-weight: 600;
        font-size: 1.5rem;
        margin: 0 0 8px;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        color: #999;
        line-height: 1.55;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo"><img src="/brand/logo.png" alt="Pods - Pai e Filho" /></div>
      <h1>Sem conexão</h1>
      <p>O Pods precisa da internet para registrar vendas e consultar o estoque. Abra de novo quando a rede voltar.</p>
    </main>
  </body>
</html>
